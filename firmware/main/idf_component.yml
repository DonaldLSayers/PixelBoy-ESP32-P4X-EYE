dependencies:
  idf: ">=5.5"
  # Official ESP32-P4-EYE board support (display, camera, SD card).
  # The "_noglib" variant would avoid LVGL, but 2.0.1/2.0.2 fail to compile
  # (they reference lv_indev_t). LVGL is compiled in but never started.
  espressif/esp32_p4_eye: "^2.0.2"
  # USB Mass Storage (browse SD card photos from a PC over the "USB" port -
  # separate from the "Debug" port used for flashing/console, since ESP32-P4
  # has independent PHYs for USB-OTG and USB-Serial-JTAG).
  # Pinned below 2.0.0: that release restructured tinyusb_config_t (descriptor
  # setup moved into nested structs), breaking app_usb_video_desc.c's
  # hand-built UVC descriptor, which targets the pre-2.0 flat-field API.
  espressif/esp_tinyusb: ">=1.7.0,<2.0.0"
  # WiFi Gallery: the P4 has no radio of its own - this talks to the
  # board's onboard ESP32-C6-MINI-1U over SDIO (its own firmware, flashed
  # separately - see app_wifi_gallery.h) so the P4 can host a small photo
  # gallery web page. ESP32P4_EYE_C6_BOARD (sdkconfig.defaults) selects this
  # exact board's SDIO pin preset, already built into this component.
  espressif/esp_hosted: "^3.0.9"
  # esp_hosted's own reference host example requires this alongside it for
  # ESP32-P4 specifically - it's what makes ESP_WIFI_ENABLED (and the rest of
  # esp_wifi.h's Kconfig, otherwise gated behind a real WiFi radio) available
  # on a chip that doesn't have one.
  espressif/esp_wifi_remote: ">=1.3.1"
