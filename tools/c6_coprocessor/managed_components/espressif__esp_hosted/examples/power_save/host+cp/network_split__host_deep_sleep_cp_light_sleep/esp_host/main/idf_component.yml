dependencies:
  esp-qa/ping-cmd:
    version: ~1.0.0
  espressif/esp_hosted:
    version: '*'
  espressif/esp_wifi_remote:
    rules:
    - if: target in [esp32p4, esp32h2]
    - if: idf_version <6.1
    version: '>=1.3.1'
  espressif/iperf-cmd:
    matches:
    - if: idf_version >=6.0
      version: ~0.1.3
    - if: idf_version <6.0
      version: ~0.1.1
  idf:
    version: '>=5.5'
